name: Build Nexus Tech
on: [push, workflow_dispatch]
jobs:
  build:
      runs-on: ubuntu-latest
          steps:
                - uses: actions/checkout@v4
                      - name: Set up JDK 8
                              uses: actions/setup-java@v4
                                      with: { java-version: '8', distribution: 'temurin' }
                                            - name: Build Mod
                                                    run: chmod +x gradlew && ./gradlew build --no-daemon
                                                          - name: Upload JAR
                                                                  uses: actions/upload-artifact@v4
                                                                          with: { name: Nexus-Tech-JAR, path: build/libs/*.jar, retention-days: 30 }
                                                                                - name: Create Release
                                                                                        if: github.ref == 'refs/heads/main'
                                                                                                uses: softprops/action-gh-release@v1
                                                                                                        with: { tag_name: v${{ github.run_number }}, name: Build ${{ github.run_number }}, files: build/libs/*.jar }
                                                                                                                env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }