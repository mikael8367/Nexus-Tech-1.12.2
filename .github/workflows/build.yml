name: Build Nexus Tech 1.12.2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - name: Build and test
        run: gradle --no-daemon clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Tech-Core
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Assemble CurseForge modpack
        run: |
          mkdir -p build/modpack/overrides/mods
          cp instance/manifest.json build/modpack/manifest.json
          cp build/libs/Nexus-Tech-Core*.jar build/modpack/overrides/mods/
          cd build/modpack
          zip -r ../Nexus-Tech-1.12.2.zip manifest.json overrides
      - name: Upload modpack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Tech-1.12.2-Pack
          path: build/Nexus-Tech-1.12.2.zip
          if-no-files-found: error
          retention-days: 14
