name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.5.1

      - name: Show build environment
        run: |
          java -version
          gradle --version

      - name: Build Forge 1.12.2 mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: NexusTech-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
