name: Build Nexus Tech 1.12.2

on:
  push:
    branches: [ main, fix/deep-bug-sweep ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - name: Build and test
        run: gradle --no-daemon clean build
      - name: Verify JAR output
        run: |
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh build/libs/*.jar
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Tech-Core
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Assemble CurseForge modpack
        run: |
          mkdir -p build/modpack/overrides/mods
          cp instance/manifest.json build/modpack/manifest.json
          cp build/libs/Nexus-Tech-Core*.jar build/modpack/overrides/mods/
          cd build/modpack
          zip -r ../Nexus-Tech-1.12.2.zip manifest.json overrides
      - name: Upload modpack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Tech-1.12.2-Pack
          path: build/Nexus-Tech-1.12.2.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Nexus-Tech-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish GitHub Release with JAR and modpack
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-tech-build-${{ github.run_number }}
          name: Nexus Tech 1.12.2 - Build ${{ github.run_number }}
          body: |
            Release automática gerada após compilação bem-sucedida.

            Commit: ${{ github.sha }}

            O JAR e o modpack anexados foram produzidos pelo workflow de build.
          files: |
            release-artifacts/*.jar
            release-artifacts/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
