name: Build mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - name: Build
        run: gradle --no-daemon clean build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ProjectE-Storage-Bridge
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
