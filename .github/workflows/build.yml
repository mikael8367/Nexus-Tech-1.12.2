name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 4.10.3

      - name: Setup decompiled workspace (Forge 1.12.2)
        run: gradle setupDecompWorkspace --no-daemon

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: NexusTech-1.12.2
          path: build/libs/*.jar
