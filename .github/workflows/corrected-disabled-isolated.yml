name: Isolated disabled reactor corrected test build
on:
  push:
    branches: ['isolated/correcoes-desativado-20261125']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Extract verified original and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          mkdir -p evidence project
          echo '4ebdefded13fa8bb3668e08e16b7658fd5b06998092a502daa2f68cb7eb9f9b8  NexusTech-projeto-montagens-livro-experimental.zip' | sha256sum -c | tee evidence/original-sha256.log
          unzip -q NexusTech-projeto-montagens-livro-experimental.zip -d project
          base64 -d .github/isolated-disabled-build/disabled.patch.gz.b64 | gzip -dc > evidence/disabled.patch
          (cd project && patch --batch --forward -p1 < ../evidence/disabled.patch) | tee evidence/patch.log
          (cd project && patch --batch --forward -p1 < ../docs/experimentos/correcoes-desativado-20261125/testes.patch) | tee evidence/test-fixes-patch.log
          find project/src/test -type f \( -name '*Test.java' -o -name 'test_*.py' \) | sort > evidence/test-inventory.txt
          java -version 2> evidence/java-version.log
      - name: Structural checks
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd project
          python3 src/test/java/com/mikael8367/nexustech/nuclear/test_disabled_static.py 2>&1 | tee ../evidence/static-test.log
      - name: Build reobfuscated Forge JAR
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd project
          bash ./gradlew --no-daemon --stacktrace assemble 2>&1 | tee ../evidence/build.log
      - name: Targeted disabled reactor Java tests
        id: disabled_java
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd project
          bash ./gradlew --no-daemon --stacktrace -I src/test/java/com/mikael8367/nexustech/nuclear/nuclear-disabled-check.init.gradle nuclearDisabledCheck 2>&1 | tee ../evidence/disabled-java-test.log
      - name: Download and verify integration test dependencies
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          mkdir -p "$RUNNER_TEMP/nexus-deps"
          cd "$RUNNER_TEMP/nexus-deps"
          curl -fL --retry 3 -o mystical.jar 'https://maven.blakesmods.com/releases/com/blakebr0/mysticalagriculture/MysticalAgriculture/1.12.2-1.7.5/MysticalAgriculture-1.12.2-1.7.5.jar'
          curl -fL --retry 3 -o cucumber.jar 'https://maven.blakesmods.com/releases/com/blakebr0/cucumber/Cucumber/1.12.2-1.1.3/Cucumber-1.12.2-1.1.3.jar'
          curl -fL --retry 3 -o mcp.zip 'https://maven.minecraftforge.net/de/oceanlabs/mcp/mcp_snapshot/20171003-1.12/mcp_snapshot-20171003-1.12.zip'
          echo 'e84a70bbcb5dc559d28c7bc65f1ef1af512485097ad89c6748249b173019975c  mystical.jar' | sha256sum -c
          echo '0475ba0f0964c4a56afd1c2765b7063849ca2b77a91d80d7f612fb15354c27e5  cucumber.jar' | sha256sum -c
          echo 'b346508f8d25e7b2bcf7484b3b1d2e549be1b8e1ba477665153ea64fd138f50c  mcp.zip' | sha256sum -c
          echo "NEXUS_MYSTICAL_JAR=$PWD/mystical.jar" >> "$GITHUB_ENV"
          echo "NEXUS_CUCUMBER_JAR=$PWD/cucumber.jar" >> "$GITHUB_ENV"
          echo "NEXUS_MCP_MAPPINGS=$PWD/mcp.zip" >> "$GITHUB_ENV"
      - name: Run disabled variant standalone suites and real integration
        id: suites
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd project
          bash ./gradlew --no-daemon --continue --stacktrace disabledStandaloneSuites 2>&1 | tee ../evidence/standalone-suites.log
      - name: Verify JAR if built and document coverage
        id: verify
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'static=%s\nbuild=%s\ndisabled_java=%s\nstandalone=%s\n' '${{ steps.static.outcome }}' '${{ steps.build.outcome }}' '${{ steps.disabled_java.outcome }}' '${{ steps.suites.outcome }}' | tee evidence/outcomes.txt
          echo 'Python tests other than test_disabled_static.py are not executed; see test-inventory.txt. Minecraft/Forge runtime, multiplayer, world save roundtrip and external mod interactions are not tested. Active-reactor suites are classified separately and not executed in the disabled variant. Passing tests are not evidence of safety.' > evidence/coverage-limitations.txt
          if [ '${{ steps.build.outcome }}' = success ]; then
            shopt -s nullglob
            jars=(project/build/libs/*.jar)
            [ "${#jars[@]}" -eq 1 ] || { echo "Expected exactly one JAR, got ${#jars[@]}"; exit 1; }
            sha256sum "${jars[0]}" | tee evidence/jar-sha256.txt
            jar tf "${jars[0]}" > evidence/jar-contents.txt
            grep -Fx 'com/mikael8367/nexustech/nuclear/NuclearDisabled.class' evidence/jar-contents.txt
            grep -Fx 'mcmod.info' evidence/jar-contents.txt
          else
            echo 'JAR compilation did not succeed; no success is claimed.'
          fi
      - name: Upload logs regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-disabled-build-evidence
          path: |
            evidence/
            project/build/reports/
            project/build/test-results/
          if-no-files-found: warn
      - name: Upload unvalidated JAR only after build and verification
        if: steps.build.outcome == 'success' && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: corrected-disabled-reactor-UNVALIDATED-JAR
          path: project/build/libs/*.jar
          if-no-files-found: error
      - name: Report failures without masking
        if: always()
        shell: bash
        run: |
          [ '${{ steps.static.outcome }}' = success ] && [ '${{ steps.build.outcome }}' = success ] && [ '${{ steps.disabled_java.outcome }}' = success ] && [ '${{ steps.suites.outcome }}' = success ] && [ '${{ steps.verify.outcome }}' = success ]
